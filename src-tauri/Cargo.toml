[package]
name = "predator-sense-tauri"
version = "0.1.0"
description = "PredatorSense Rust/Tauri 2 Clone"
authors = ["you"]
edition = "2024"

[lib]
name = "predator_sense_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.7", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
parking_lot = "0.12"
wmi = "0.18"

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
