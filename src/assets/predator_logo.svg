<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242b35" />
      <stop offset="35%" stop-color="#161a22" />
      <stop offset="100%" stop-color="#0b0d12" />
    </linearGradient>

    <!-- Wing Plate Gradient -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a4556" />
      <stop offset="60%" stop-color="#1e242e" />
      <stop offset="100%" stop-color="#101318" />
    </linearGradient>

    <!-- Cyan Neon Accent Gradient -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#00c8e6" />
      <stop offset="100%" stop-color="#007799" />
    </linearGradient>

    <!-- Metallic Left (Light Silver) -->
    <linearGradient id="metalLight" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#d8e0e8" />
      <stop offset="100%" stop-color="#909baa" />
    </linearGradient>

    <!-- Metallic Right (Steel Shadow) -->
    <linearGradient id="metalDark" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#707b8c" />
      <stop offset="60%" stop-color="#4a5360" />
      <stop offset="100%" stop-color="#2c333d" />
    </linearGradient>

    <!-- Glow Filter for Cyan Wings -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Emblem Drop Shadow -->
    <filter id="emblemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- 1. Central Shield Body -->
  <path d="M 52,28 L 204,28 L 194,204 L 164,228 L 92,228 L 62,204 Z" 
        fill="url(#shieldBg)" stroke="#2b3442" stroke-width="2" />

  <!-- Inner Armor Inset -->
  <path d="M 58,34 L 198,34 L 189,198 L 160,220 L 96,220 L 67,198 Z" 
        fill="#101319" opacity="0.9" />

  <!-- 2. Left Wing Flank with Neon Cyan Edge -->
  <!-- Wing Base -->
  <path d="M 28,34 L 56,28 L 64,196 L 46,182 L 32,140 Z" 
        fill="url(#wingGrad)" stroke="#1a202c" stroke-width="1.5" />
  <!-- Neon Cyan Accent Stripe -->
  <path d="M 38,40 Q 32,100 48,176" 
        fill="none" stroke="url(#cyanNeon)" stroke-width="4.5" stroke-linecap="round" filter="url(#cyanGlow)" />
  <path d="M 38,40 Q 32,100 48,176" 
        fill="none" stroke="#e0ffff" stroke-width="1.5" stroke-linecap="round" />

  <!-- 3. Right Wing Flank with Neon Cyan Edge -->
  <!-- Wing Base -->
  <path d="M 228,34 L 200,28 L 192,196 L 210,182 L 224,140 Z" 
        fill="url(#wingGrad)" stroke="#1a202c" stroke-width="1.5" />
  <!-- Neon Cyan Accent Stripe -->
  <path d="M 218,40 Q 224,100 208,176" 
        fill="none" stroke="url(#cyanNeon)" stroke-width="4.5" stroke-linecap="round" filter="url(#cyanGlow)" />
  <path d="M 218,40 Q 224,100 208,176" 
        fill="none" stroke="#e0ffff" stroke-width="1.5" stroke-linecap="round" />

  <!-- 4. Iconic Predator 3D Metallic Crest -->
  <g filter="url(#emblemShadow)">
    <!-- LEFT FACET GROUP (Light Silver Bevel) -->
    <!-- Left Crown Outer Horn -->
    <polygon points="128,78 128,52 82,42 74,124 94,142 96,112 110,132" fill="url(#metalLight)" />
    <!-- Left Inner Spire -->
    <polygon points="128,78 110,132 114,178 128,156" fill="url(#metalLight)" />
    <!-- Left Lower Fangs / Claws -->
    <polygon points="74,124 90,126 84,102" fill="url(#metalLight)" opacity="0.9" />
    <polygon points="94,142 98,174 114,178 108,142" fill="url(#metalLight)" />

    <!-- RIGHT FACET GROUP (Dark Steel Bevel for 3D Contrast) -->
    <!-- Right Crown Outer Horn -->
    <polygon points="128,78 128,52 174,42 182,124 162,142 160,112 146,132" fill="url(#metalDark)" />
    <!-- Right Inner Spire -->
    <polygon points="128,78 146,132 142,178 128,156" fill="url(#metalDark)" />
    <!-- Right Lower Fangs / Claws -->
    <polygon points="182,124 166,126 172,102" fill="url(#metalDark)" opacity="0.9" />
    <polygon points="162,142 158,174 142,178 148,142" fill="url(#metalDark)" />

    <!-- Center Razor Ridge Line -->
    <line x1="128" y1="52" x2="128" y2="156" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />
  </g>
</svg>
